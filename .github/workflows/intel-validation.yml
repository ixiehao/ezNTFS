name: Intel installer and NTFS validation

on:
  push:
    branches: [qa/intel-macos-validation]

permissions:
  contents: read

jobs:
  intel:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native Intel runtime
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = X64
          test "$(/usr/bin/uname -m)" = x86_64
          sw_vers
          csrutil status
          xcodebuild -version
          swift --version
      - name: Run native Swift and installer tests
        run: |
          python3 scripts/check-localizations.py
          node --test scripts/check-installer.mjs
          swift test
      - name: Install verified macFUSE and build Intel package
        shell: bash
        run: bash scripts/qa-intel-installer.sh prepare
      - name: Install Intel package and verify daemon and driver repair
        shell: bash
        run: bash scripts/qa-intel-installer.sh install
      - name: Write and remount an isolated NTFS image
        shell: bash
        run: bash scripts/qa-intel-installer.sh image
