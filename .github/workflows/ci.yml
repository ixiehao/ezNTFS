name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # The runner's default Swift 6.1 compiler crashes during SwiftUI code generation.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate localization
        run: python3 scripts/check-localizations.py
      - name: Test installer preflight
        run: node --test scripts/check-installer.mjs
      - name: Test (NTFS image integration requires macFUSE and runs separately)
        run: swift test
      - name: Build release
        run: swift build -c release
