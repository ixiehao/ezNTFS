name: Deploy website

on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/build-website.py', 'Resources/Brand/AppIcon.svg', 'Resources/Tabler/**', 'Resources/Tabler.xcassets/**', '.github/workflows/deploy-pages.yml']
  pull_request:
    paths: ['website/**', 'scripts/build-website.py', 'Resources/Brand/AppIcon.svg', 'Resources/Tabler/**', 'Resources/Tabler.xcassets/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezntfs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate static website
        run: |
          python3 scripts/build-website.py
          python3 scripts/build-website.py --check
      - name: Test three languages on desktop and mobile
        working-directory: website
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium webkit
          npm test
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/website

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
